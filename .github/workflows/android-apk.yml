name: FlClash Build

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Core branch in FokySN1K/mihomo: flclash-core or flclash-stock"
        required: true
        default: "flclash-core"
      platform:
        description: "What to build"
        type: choice
        options:
          - all
          - android
          - windows
        default: all
      arch:
        description: "Android ABI"
        type: choice
        options:
          - arm64
          - arm
          - amd64
        default: arm64
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: flclash-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  GO_VERSION: "1.27.1"
  NDK_VERSION: r28c
  CARGO_BUILD_JOBS: "2"

jobs:
  android:
    name: Android APK
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      ARCH: ${{ github.event.inputs.arch || 'arm64' }}
      CORE_REF: ${{ github.event.inputs.core_ref || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select core
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CORE_REF}" ]]; then
            git -C core/Clash.Meta fetch https://github.com/FokySN1K/mihomo.git "${CORE_REF}"
            git -C core/Clash.Meta checkout FETCH_HEAD
          fi
          git -C core/Clash.Meta log --oneline -1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch "${ARCH}" -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-android-${{ env.ARCH }}-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows exe
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-2022
    env:
      CORE_REF: ${{ github.event.inputs.core_ref || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select core
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CORE_REF}" ]]; then
            git -C core/Clash.Meta fetch https://github.com/FokySN1K/mihomo.git "${CORE_REF}"
            git -C core/Clash.Meta checkout FETCH_HEAD
          fi
          git -C core/Clash.Meta log --oneline -1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: dart setup.dart windows -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-windows-amd64-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: flclash-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
